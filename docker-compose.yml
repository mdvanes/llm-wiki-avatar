# Everything runs locally on CPU. Start with:  docker compose up --build
# Then open http://localhost:3000
#
# The LLM is expected on the host (native Ollama is much faster than Ollama in Docker on a Mac).
# To run Ollama in Docker instead:  docker compose --profile ollama up --build
# with LLM_BASE_URL_DOCKER=http://ollama:11434/v1 in .env.

name: llm-wiki-avatar

services:
  livekit:
    image: livekit/livekit-server:v1.13
    # Dev mode: API key "devkey", secret "secret". WebRTC over 7881/tcp and 7882/udp.
    # --node-ip 127.0.0.1 makes the ICE candidates reachable from the browser via the published ports.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    # The agent shares this network namespace; it needs to reach Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      # Loaded at startup by newer Speaches versions; speaches-models below does the download.
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-small}","${TTS_EN_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}","${TTS_NL_MODEL:-speaches-ai/piper-nl_BE-nathalie-medium}","${TTS_EN_MALE_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}","${TTS_NL_MALE_MODEL:-speaches-ai/piper-nl_BE-rdh-medium}"]'
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__INFERENCE_DEVICE: cpu
      STT_MODEL_TTL: "-1"
      TTS_MODEL_TTL: "-1"
      ENABLE_UI: "false"
      LOG_LEVEL: info
    volumes:
      - hf-cache:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 2m
    restart: unless-stopped

  # Downloads the speech models into the hf-cache volume (about 1 GB on first run, instant after).
  speaches-models:
    image: curlimages/curl:latest
    environment:
      MODELS: ${STT_MODEL:-Systran/faster-whisper-small} ${TTS_EN_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX} ${TTS_NL_MODEL:-speaches-ai/piper-nl_BE-nathalie-medium} ${TTS_EN_MALE_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX} ${TTS_NL_MALE_MODEL:-speaches-ai/piper-nl_BE-rdh-medium}
    entrypoint:
      - sh
      - -c
      - |
        for m in $$MODELS; do
          echo "downloading $$m"
          curl -fsS -X POST --max-time 1800 "http://speaches:8000/v1/models/$$m" || exit 1
          echo
        done
    depends_on:
      speaches:
        condition: service_healthy
    restart: on-failure

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    # Share LiveKit's network namespace: the server advertises 127.0.0.1 as its ICE address.
    network_mode: service:livekit
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AGENT_NAME: ${AGENT_NAME:-llm-wiki-avatar}
      WIKI_SOURCES: "${WIKI_SOURCES:-}"
      VOCAB_DIR: /app/vocab
      # Bind mounts from macOS/Windows do not deliver file events; poll instead.
      WIKI_WATCH_POLL: "true"
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      SPEACHES_URL: http://speaches:8000/v1
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      TTS_EN_MODEL: ${TTS_EN_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
      TTS_EN_VOICE: ${TTS_EN_VOICE:-af_heart}
      TTS_NL_MODEL: ${TTS_NL_MODEL:-speaches-ai/piper-nl_BE-nathalie-medium}
      TTS_NL_VOICE: ${TTS_NL_VOICE:-nathalie}
      TTS_EN_MALE_MODEL: ${TTS_EN_MALE_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
      TTS_EN_MALE_VOICE: ${TTS_EN_MALE_VOICE:-am_michael}
      TTS_NL_MALE_MODEL: ${TTS_NL_MALE_MODEL:-speaches-ai/piper-nl_BE-rdh-medium}
      TTS_NL_MALE_VOICE: ${TTS_NL_MALE_VOICE:-rdh}
      KOKORO_URL: ${KOKORO_URL_DOCKER:-http://kokoro:8880}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-female}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ./sample-wiki:/app/sample-wiki:ro
      - ./wikis:/app/wikis:ro
      - ./vocab:/app/vocab:ro
    depends_on:
      livekit:
        condition: service_started
      speaches-models:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # The URL the *browser* uses to reach LiveKit.
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AGENT_NAME: ${AGENT_NAME:-llm-wiki-avatar}
      WIKI_SOURCES: "${WIKI_SOURCES:-}"
      DEFAULT_VOICE: ${DEFAULT_VOICE:-female}
    volumes:
      - ./sample-wiki:/app/sample-wiki:ro
      - ./wikis:/app/wikis:ro
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - livekit
    restart: unless-stopped

  # Word-timed lip-sync for "Voice and avatar, female (premium)": docker compose --profile premium up.
  # Without it, the premium option falls back to the regular voice and loudness lip-sync.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: [premium]
    ports:
      - "8880:8880"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      - ollama
    restart: on-failure

volumes:
  hf-cache:
  ollama:
