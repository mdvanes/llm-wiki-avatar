# Configure an OpenAI-compatible API or native Ollama, then: docker compose up --build
# Then open http://localhost:3000
#
# The LLM is expected on the host (native Ollama is much faster than Ollama in Docker on a Mac).
# To run Ollama in Docker instead:  docker compose --profile ollama up --build
# with LLM_BASE_URL_DOCKER=http://ollama:11434/v1 in .env.

name: llm-wiki-avatar

services:
  livekit:
    image: livekit/livekit-server:v1.13
    # Dev mode: API key "devkey", secret "secret". WebRTC over 7881/tcp and 7882/udp.
    # --node-ip 127.0.0.1 makes the ICE candidates reachable from the browser via the published ports.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    # The agent shares this network namespace; it needs to reach Ollama on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    # Share LiveKit's network namespace: the server advertises 127.0.0.1 as its ICE address.
    network_mode: service:livekit
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AGENT_NAME: ${AGENT_NAME:-llm-wiki-avatar}
      WIKI_SOURCES: "${WIKI_SOURCES:-}"
      # Bind mounts from macOS/Windows do not deliver file events; poll instead.
      WIKI_WATCH_POLL: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_AUTH: ${LLM_AUTH:-api-key}
      ENTRA_SCOPE: ${ENTRA_SCOPE:-}
      ENTRA_AUTH_MODE: ${ENTRA_AUTH_MODE:-cli}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-${LLM_BASE_URL:-}}
      LLM_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-90}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ./sample-wiki:/app/sample-wiki:ro
      - ./wikis:/app/wikis:ro
    depends_on:
      - livekit
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # The URL the *browser* uses to reach LiveKit.
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AGENT_NAME: ${AGENT_NAME:-llm-wiki-avatar}
      WIKI_SOURCES: "${WIKI_SOURCES:-}"
      DEFAULT_VOICE: ${DEFAULT_VOICE:-female}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_AUTH: ${LLM_AUTH:-api-key}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./sample-wiki:/app/sample-wiki:ro
      - ./wikis:/app/wikis:ro
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - livekit
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      - ollama
    restart: on-failure

volumes:
  ollama:
