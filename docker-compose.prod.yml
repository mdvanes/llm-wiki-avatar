# Example production setup using the published images from GHCR (nothing is built from the repo).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Required in .env (compose refuses to start without them):
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET  real keys; the secret must be at least 32 characters
#                                        (e.g. `openssl rand -base64 32`)
#   LIVEKIT_NODE_IP                      the host IP that browsers can reach (public or LAN IP)
#   LIVEKIT_PUBLIC_URL                   LiveKit URL as seen from the browser, e.g. wss://livekit.example.com
#   WIKI_PATH                            host folder with the markdown wiki
#
# Browsers only allow microphone access on https (or localhost), so put the frontend (port 3000) and LiveKit
# signalling (port 7880) behind a TLS reverse proxy. WebRTC media uses 7881/tcp and 7882/udp directly; open those
# in the firewall. The frontend has no authentication: restrict access at the proxy if needed.
#
# The LLM is any OpenAI-compatible server (LLM_BASE_URL_DOCKER). To run Ollama alongside:
#   docker compose -f docker-compose.prod.yml --profile ollama up -d
# with LLM_BASE_URL_DOCKER=http://ollama:11434/v1 in .env.

name: llm-wiki-avatar

services:
  livekit:
    image: livekit/livekit-server:v1.13
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP}
    command: --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    # The agent shares this network namespace; it may need to reach an LLM on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-small}","${TTS_EN_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}","${TTS_NL_MODEL:-speaches-ai/piper-nl_BE-nathalie-medium}","${TTS_EN_MALE_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}","${TTS_NL_MALE_MODEL:-speaches-ai/piper-nl_BE-rdh-medium}"]'
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__INFERENCE_DEVICE: cpu
      STT_MODEL_TTL: "-1"
      TTS_MODEL_TTL: "-1"
      ENABLE_UI: "false"
      LOG_LEVEL: info
    volumes:
      - hf-cache:/home/ubuntu/.cache/huggingface/hub
    # Not published: only the agent talks to Speaches.
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 2m
    restart: unless-stopped

  # Downloads the speech models into the hf-cache volume (about 1 GB on first run, instant after).
  speaches-models:
    image: curlimages/curl:latest
    environment:
      MODELS: ${STT_MODEL:-Systran/faster-whisper-small} ${TTS_EN_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX} ${TTS_NL_MODEL:-speaches-ai/piper-nl_BE-nathalie-medium} ${TTS_EN_MALE_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX} ${TTS_NL_MALE_MODEL:-speaches-ai/piper-nl_BE-rdh-medium}
    entrypoint:
      - sh
      - -c
      - |
        for m in $$MODELS; do
          echo "downloading $$m"
          curl -fsS -X POST --max-time 1800 "http://speaches:8000/v1/models/$$m" || exit 1
          echo
        done
    depends_on:
      speaches:
        condition: service_healthy
    restart: on-failure

  agent:
    image: ghcr.io/mdvanes/llm-wiki-avatar-agent:latest
    # Share LiveKit's network namespace so the agent reaches LiveKit on localhost.
    network_mode: service:livekit
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AGENT_NAME: ${AGENT_NAME:-llm-wiki-avatar}
      WIKI_DIR: /wiki
      # The image contains the repo's vocab/; mount your own below to override it.
      VOCAB_DIR: /app/vocab
      WIKI_WATCH_POLL: ${WIKI_WATCH_POLL:-false}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      SPEACHES_URL: http://speaches:8000/v1
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      TTS_EN_MODEL: ${TTS_EN_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
      TTS_EN_VOICE: ${TTS_EN_VOICE:-af_heart}
      TTS_NL_MODEL: ${TTS_NL_MODEL:-speaches-ai/piper-nl_BE-nathalie-medium}
      TTS_NL_VOICE: ${TTS_NL_VOICE:-nathalie}
      TTS_EN_MALE_MODEL: ${TTS_EN_MALE_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
      TTS_EN_MALE_VOICE: ${TTS_EN_MALE_VOICE:-am_michael}
      TTS_NL_MALE_MODEL: ${TTS_NL_MALE_MODEL:-speaches-ai/piper-nl_BE-rdh-medium}
      TTS_NL_MALE_VOICE: ${TTS_NL_MALE_VOICE:-rdh}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-female}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ${WIKI_PATH:?set WIKI_PATH}:/wiki:ro
      # - ./vocab:/app/vocab:ro
    depends_on:
      livekit:
        condition: service_started
      speaches-models:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/mdvanes/llm-wiki-avatar-frontend:latest
    environment:
      # The URL the *browser* uses to reach LiveKit.
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:?set LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AGENT_NAME: ${AGENT_NAME:-llm-wiki-avatar}
      WIKI_DIR: /wiki
      # The image ships the CC0 female avatar (/avatars/mpfb.glb); use a full URL for other models.
      AVATAR_FEMALE_URL: ${AVATAR_FEMALE_URL:-}
      AVATAR_MALE_URL: ${AVATAR_MALE_URL:-}
      AVATAR_URL: ${AVATAR_URL:-}
      AVATAR_BODY: ${AVATAR_BODY:-}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-female}
      AVATAR_VIEW: ${AVATAR_VIEW:-head}
      AVATAR_CAMERA_DISTANCE: ${AVATAR_CAMERA_DISTANCE:-0}
      AVATAR_CAMERA_Y: ${AVATAR_CAMERA_Y:-}
    volumes:
      - ${WIKI_PATH:?set WIKI_PATH}:/wiki:ro
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - livekit
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      - ollama
    restart: on-failure

volumes:
  hf-cache:
  ollama:
